language: minimal

services:
  - docker

script:
  - docker build -t udagram-api-feed ./udagram-api-feed
  - docker build -t udagram-api-user ./udagram-api-user
  - docker build -t reverseproxy ./udagram-reverseproxy
  - docker build -t udagram-frontend ./udagram-frontend

after_success:
  - docker tag udagram-api-feed albisdandan-coder/udagram-api-feed:v1
  - docker tag udagram-api-user albisdandan-coder/udagram-api-user:v1
  - docker tag reverseproxy albisdandan-coder/reverseproxy:v1
  - docker tag udagram-frontend albisdandan-coder/udagram-frontend:v1

  - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

  - docker push albisdandan-coder/udagram-api-feed:v1
  - docker push albisdandan-coder/udagram-api-user:v1
  - docker push albisdandan-coder/reverseproxy:v1
  - docker push albisdandan-coder/udagram-frontend:v1